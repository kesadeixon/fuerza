<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fuerza · Tres días</title>
<meta name="theme-color" content="#FAFAF7">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fuerza">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --accent:#0E7C66; --ink:#1B1D22; --bg:#FAFAF7; --muted:#9AA0A6;
    --line:#EEEEE7; --line2:#EAEAE4; --soft:#F1F1EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  select:focus,input:focus{border-color:var(--accent)!important;outline:none;}
  summary{list-style:none;cursor:pointer;}
  summary::-webkit-details-marker{display:none;}
  button:active{transform:scale(.98);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:76px;}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;
    position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line);
    padding-top:max(16px,env(safe-area-inset-top));}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;}
  .brand{font-size:13px;font-weight:800;letter-spacing:1.2px;}
  .brandSub{font-size:11px;color:var(--muted);margin-top:1px;}
  .main{padding:16px 18px 24px;}
  .sectionLabel{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 12px;}

  .warn{display:flex;align-items:center;gap:6px;margin:10px 18px 0;padding:8px 12px;background:#FEF3E2;color:#8A5A11;border-radius:10px;font-size:12.5px;}

  .ringWrap{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px;}
  .ringCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ringNum{font-size:28px;font-weight:800;line-height:1;}
  .ringNum span{font-size:15px;color:#B4B8BD;}
  .ringCap{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;}

  .dayCard{text-align:left;background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:16px 18px;width:100%;display:block;}
  .dayCard.done{border-color:var(--accent);}
  .eyebrow{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;text-transform:uppercase;}
  .dayName{font-size:18px;font-weight:700;margin-top:2px;}
  .dayMeta{font-size:13px;color:#8A8F98;margin-top:4px;}
  .doneBadge{display:inline-flex;align-items:center;gap:4px;background:#E7F4F0;color:var(--accent);font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;}
  .startBadge{font-size:13px;font-weight:700;color:var(--accent);}

  .iconBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:#5A5F67;display:flex;align-items:center;justify-content:center;}

  .dateRow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .dateRow input{border:none;background:transparent;font-size:14px;font-weight:600;text-align:right;color:var(--ink);}

  .exCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;}
  .exTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .restChip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:#5A5F67;border:1px solid var(--line2);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;}
  .exImg{display:block;width:100%;height:104px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:4px;cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;background:rgba(17,18,20,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .lbInner{max-width:100%;text-align:center;}
  .lbInner img{max-width:92vw;max-height:72vh;background:#fff;border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .lbCap{color:#fff;font-size:14px;font-weight:600;margin-top:14px;}
  .lbHint{color:#B9BEC4;font-size:12px;margin-top:4px;}
  .restPill{position:fixed;bottom:144px;left:50%;transform:translateX(-50%);width:min(440px,92%);background:var(--ink);color:#fff;border-radius:16px;padding:11px 14px;z-index:18;box-shadow:0 10px 34px rgba(0,0,0,.28);}
  .restRow{display:flex;align-items:center;gap:8px;}
  .restLabel{font-size:11px;color:#B9BEC4;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .restTime{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:66px;text-align:center;}
  .restBtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:700;}
  .restBar{height:4px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:9px;overflow:hidden;}
  .restBarFill{height:100%;width:100%;background:var(--accent);border-radius:3px;transition:width 1s linear;}
  .exName{font-size:15px;font-weight:700;}
  .exName b{color:#C4C8CC;font-weight:800;margin-right:6px;}
  .exMus{font-size:12px;color:var(--muted);margin-top:2px;}
  .coachNote{margin-top:8px;font-size:12.5px;color:#7A5A20;background:#FBF6E9;border-radius:8px;padding:7px 10px;line-height:1.4;}
  .rowGrid{display:flex;align-items:center;gap:8px;padding:5px 0;}
  .colHead{font-size:11px;color:#B4B8BD;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .setNum{width:22px;text-align:center;font-size:13px;font-weight:700;color:#C4C8CC;}
  .inWrap{position:relative;flex:1;}
  .numInput{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:600;color:var(--ink);text-align:center;background:#FCFCFA;font-variant-numeric:tabular-nums;}
  .suffix{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:#B4B8BD;font-weight:600;pointer-events:none;}
  .checkBtn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line2);background:var(--soft);color:#B4B8BD;display:flex;align-items:center;justify-content:center;}
  .checkBtn.done{background:var(--accent);border-color:var(--accent);color:#fff;}
  .addSet{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--accent);background:transparent;border:none;padding:4px 2px;}
  .addSet.muted{color:#B4B8BD;}

  .saveBar{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:min(480px,100%);
    display:flex;align-items:center;justify-content:space-between;padding:12px 18px;
    background:rgba(250,250,247,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);}
  .saveBtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;}

  .histCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;}
  .stravaBtn{display:inline-flex;align-items:center;gap:5px;background:#FC4C02;color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;}
  .claudeBtn{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;}
  .sheetOv{position:fixed;inset:0;background:rgba(17,18,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:120;}
  .sheet{background:#fff;width:min(480px,100%);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;}
  .sheetH{font-size:17px;font-weight:800;margin-bottom:14px;}
  .sheetRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .sheetRow .k{color:var(--muted);}
  .sheetRow .v{font-weight:700;text-align:right;}
  .sheetLab{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;}
  .sheetDesc{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;font-family:inherit;margin:0;max-height:170px;overflow:auto;}
  .sheetBtns{display:flex;gap:8px;margin-top:14px;}
  .btnPri{flex:2;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;}
  .btnSec{flex:1;background:var(--soft);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:14px;font-weight:700;}
  .btnStrava{display:block;text-align:center;background:#FC4C02;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;margin-top:8px;text-decoration:none;}
  .sheetHelp{font-size:12px;color:#6A6F76;margin-top:12px;line-height:1.55;}
  .sheetClose{width:100%;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:12px;margin-top:4px;}
  .histDate{font-size:15px;font-weight:700;text-transform:capitalize;}
  .histDay{font-size:13px;color:var(--accent);font-weight:600;margin-top:2px;}
  .trashBtn{border:none;background:transparent;color:#C4C8CC;padding:4px;}
  .statVal{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .statLab{font-size:11px;color:var(--muted);font-weight:600;}
  .summary{font-size:13px;color:var(--accent);font-weight:600;}
  .detLine{font-size:13px;color:#4A4F57;}
  .detLine b{color:var(--ink);}

  .bigStat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;}
  .bigStat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
  .bigStat .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
  .chartCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;}
  .chartHint{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;}
  select.exSel{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;-webkit-appearance:none;}

  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);
    display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);
    padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:15;}
  .navBtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;padding:4px 16px;flex:1;color:#9AA0A6;}
  .navBtn.active{color:var(--accent);}
  .navBtn span{font-size:11px;font-weight:500;}
  .navBtn.active span{font-weight:700;}

  .menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line2);border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.1);padding:6px;z-index:30;min-width:172px;}
  .menuItem{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:none;border-radius:8px;text-align:left;}
  .menuItem:hover{background:var(--soft);}
  .backdrop{position:fixed;inset:0;z-index:20;}

  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;gap:8px;}
  .emptyIco{width:56px;height:56px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .emptyTitle{font-size:17px;font-weight:700;}
  .emptyBody{font-size:14px;color:#8A8F98;max-width:260px;}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* ================= ICONS (SVG inline) ================= */
function ico(name, size, sw){
  size = size||20; sw = sw||2;
  var P = {
    dumbbell:'<path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/>',
    cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    trend:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
    up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
    back:'<path d="M15 18l-6-6 6-6"/>',
    trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
    save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+P[name]+'</svg>';
}

/* ================= PLAN (del PDF) ================= */
var PLAN = [
  {id:1, short:"Día 1", name:"Piernas y Glúteos", exercises:[
    {id:"d1e1", name:"Sentadilla · Barra", muscles:"Cuádriceps, Glúteos", type:"weight", targets:[12,10,8], rest:120},
    {id:"d1e2", name:"Peso muerto · Barra hexagonal", muscles:"Lumbar, Corvas, Glúteos", type:"weight", targets:[12,10,8], rest:120, note:"Carga muy poco o nada para ir cogiendo la técnica poco a poco."},
    {id:"d1e3", name:"Prensa a 45°", muscles:"Cuádriceps, Glúteos", type:"weight", targets:[12,10,10,10], rest:90},
    {id:"d1e4", name:"Curl femoral sentado", muscles:"Corvas", type:"weight", targets:[12,10,10,10], rest:60},
    {id:"d1e5", name:"Extensión de piernas sentado", muscles:"Cuádriceps", type:"weight", targets:[12,10,10], rest:60},
    {id:"d1e6", name:"Hip thrust alto", muscles:"Glúteos", type:"weight", targets:[12,12,12,12], rest:90, note:"De momento solo para coger técnica del movimiento."}
  ]},
  {id:2, short:"Día 2", name:"Pecho, Bíceps y Tríceps", exercises:[
    {id:"d2e1", name:"Press de pectoral en máquina", muscles:"Pecho", type:"weight", targets:[12,10,8], rest:90, note:"Máquina Pure Strength, junto a la jaula de sentadillas."},
    {id:"d2e2", name:"Press de banca · Barra", muscles:"Pecho", type:"weight", targets:[12,12,12], rest:120, note:"Trabajar técnica con poco peso."},
    {id:"d2e3", name:"Planchas", muscles:"Pecho / Core", type:"time", targets:[40,40,40], rest:45, note:"Realizar cambios de posición."},
    {id:"d2e4", name:"Fly · Kinesis", muscles:"Pecho", type:"weight", targets:[12,10,8], rest:60},
    {id:"d2e5", name:"Curl de bíceps de pie", muscles:"Bíceps", type:"weight", targets:[12,10,8], rest:60},
    {id:"d2e6", name:"Curl isométrico · Pulley", muscles:"Bíceps", type:"weight", targets:[12,10,8], rest:60},
    {id:"d2e7", name:"Extensión de codo", muscles:"Tríceps", type:"weight", targets:[12,10,8], rest:60},
    {id:"d2e8", name:"Fondos de tríceps · Caja", muscles:"Tríceps", type:"reps", targets:[12,10,8], rest:60}
  ]},
  {id:3, short:"Día 3", name:"Espalda y Bíceps", exercises:[
    {id:"d3e1", name:"Jalón al pecho", muscles:"Dorsales", type:"weight", targets:[12,10,8], rest:90},
    {id:"d3e2", name:"Remo mancuerna transversal (izq.)", muscles:"Espalda", type:"weight", targets:[12,10,8], rest:90},
    {id:"d3e3", name:"Máquina de remos sagital", muscles:"Espalda", type:"weight", targets:[12,10,8], rest:90},
    {id:"d3e4", name:"Remo con mancuernas", muscles:"Espalda", type:"weight", targets:[12,10,8], rest:90},
    {id:"d3e5", name:"Dominadas", muscles:"Espalda", type:"reps", targets:[12,10,8], rest:90},
    {id:"d3e6", name:"Curl de bíceps de pie", muscles:"Bíceps", type:"weight", targets:[12,10,8], rest:60},
    {id:"d3e7", name:"Predicador · Barra", muscles:"Bíceps", type:"weight", targets:[12,10,8], rest:60}
  ]}
];
var ALL = PLAN.reduce(function(a,d){return a.concat(d.exercises);},[]);
function findEx(id){ for(var i=0;i<ALL.length;i++) if(ALL[i].id===id) return ALL[i]; }
function findDay(id){ for(var i=0;i<PLAN.length;i++) if(PLAN[i].id===id) return PLAN[i]; }

/* ================= Helpers ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,"0"); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtDate(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"}); }
function fmtLong(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}); }
function isoWeek(iso){
  var d=new Date(iso+"T00:00:00"); var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+3);
  var ft=new Date(d.getFullYear(),0,4); var fd=(ft.getDay()+6)%7; ft.setDate(ft.getDate()-fd+3);
  var w=1+Math.round((d-ft)/(7*24*3600*1000)); return d.getFullYear()+"-S"+pad(w);
}
function weekLabel(iso){ var d=new Date(iso+"T00:00:00"); var day=(d.getDay()+6)%7; var m=new Date(d); m.setDate(d.getDate()-day);
  return m.toLocaleDateString("es-ES",{day:"2-digit",month:"short"}); }
function est1RM(w,r){ return (w>0&&r>0)?Math.round(w*(1+r/30)):0; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= Storage ================= */
var KEY="fuerza-sessions";
function loadSessions(){ try{ var v=localStorage.getItem(KEY); return v?JSON.parse(v):[]; }catch(e){ return []; } }
function saveSessions(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); return true; }catch(e){ return false; } }

/* Ajustes (descansos personalizados) — clave separada, no afecta a las sesiones */
var SKEY="fuerza-settings";
function loadSettings(){ try{ var v=localStorage.getItem(SKEY); return v?JSON.parse(v):{rest:{}}; }catch(e){ return {rest:{}}; } }
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){} }
var settings=loadSettings(); if(!settings.rest) settings.rest={};
function effRest(exId){ var o=settings.rest[exId]; var ex=findEx(exId); return (o!=null?o:(ex&&ex.rest))||60; }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+pad(s%60); }

/* ---- Sonido (bip al terminar el descanso) ---- */
var actx=null;
function ensureAudio(){ try{ if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(){ try{ if(!actx) return; var t=actx.currentTime;
  function tone(f,start,dur){ var o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t+start); g.gain.exponentialRampToValueAtTime(0.35,t+start+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+start+dur); o.start(t+start); o.stop(t+start+dur+0.02); }
  tone(880,0,0.35); tone(1175,0.18,0.4);
}catch(e){} }

/* ---- Temporizador de descanso ---- */
var restTimer=null;
function clearRest(){ if(restTimer){ if(restTimer.iv) clearInterval(restTimer.iv); if(restTimer.el&&restTimer.el.parentNode) restTimer.el.parentNode.removeChild(restTimer.el); restTimer=null; } }
function startRest(exId){
  clearRest(); ensureAudio();
  var total=effRest(exId);
  var el=buildRestPill(exId,total);

}
function tickRest(){ if(!restTimer) return; restTimer.remaining--; if(restTimer.remaining<=0) finishRest(); else updateRestPill(); }
function finishRest(){ if(!restTimer) return; updateRestPill(true); beep(); if(navigator.vibrate){ try{ navigator.vibrate([200,80,200]); }catch(e){} }
  clearInterval(restTimer.iv); restTimer.iv=null; var el=restTimer.el;
  setTimeout(function(){ if(restTimer&&restTimer.el===el) clearRest(); },2600); }
function buildRestPill(exId,total){

}
function updateRestPill(done){ if(!restTimer||!restTimer.el) return; var el=restTimer.el;
  el._time.textContent = done?"0:00":mmss(restTimer.remaining);
  el._fill.style.width = (done?0:Math.max(0,restTimer.remaining/restTimer.total)*100)+"%";

/* mini helper de creación de elementos */
function h(tag, props){
  var el=document.createElement(tag);
  if(props){ for(var k in props){ var v=props[k];
    if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k==="text") el.textContent=v;
    else if(k.slice(0,2)==="on"&&typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!==false&&v!=null) el.setAttribute(k,v);
  }}
  for(var i=2;i<arguments.length;i++){ var c=arguments[i]; if(c==null) continue;
    if(Array.isArray(c)){ c.forEach(function(x){ if(x!=null) el.appendChild(typeof x==="object"?x:document.createTextNode(String(x))); }); }
    else el.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));
  }
  return el;
}
function lastValue(exId,setIdx,field){
  for(var i=sessions.length-1;i>=0;i--){ var arr=sessions[i].entries&&sessions[i].entries[exId];
    if(arr&&arr[setIdx]&&arr[setIdx][field]!=null&&arr[setIdx][field]!=="") return arr[setIdx][field]; }
  for(var j=sessions.length-1;j>=0;j--){ var a=sessions[j].entries&&sessions[j].entries[exId];
    if(a&&a.length){ var last=a[a.length-1]; if(last&&last[field]!=null&&last[field]!=="") return last[field]; } }
  return "";
}

/* ---- Exportación para Claude (Markdown con nombres resueltos) ---- */
function setLabel(ex,set){
  if(set.seconds!=null) return set.seconds+"s";
  if((ex&&ex.type==="reps")||set.weight==null) return "×"+(set.reps!=null?set.reps:"–");
  return set.weight+"kg×"+(set.reps!=null?set.reps:"–");
}
function sessionStats(s){
  var sets=0, volume=0;
  for(var k in s.entries){ sets+=s.entries[k].length; s.entries[k].forEach(function(x){ volume+=(x.reps||0)*(x.weight||0); }); }
  return {sets:sets, volume:Math.round(volume)};
}
function sessionMarkdown(s){
  var day=findDay(s.dayId); var st=sessionStats(s);
  var lines=["### "+s.date+" · "+(day?day.short+" · "+day.name:"Sesión")];
  var listed={};
  if(day){ day.exercises.forEach(function(ex){
    var sets=s.entries[ex.id]; if(!sets||!sets.length) return; listed[ex.id]=true;
    lines.push("- "+ex.name+": "+sets.map(function(set){return setLabel(ex,set);}).join(", "));
  }); }
  for(var exId in s.entries){ if(listed[exId]) continue; var ex=findEx(exId);
    lines.push("- "+(ex?ex.name:exId)+": "+s.entries[exId].map(function(set){return setLabel(ex,set);}).join(", ")); }
  lines.push("Volumen: "+st.volume+" kg · Series: "+st.sets);
  return lines.join("\n");
}
function historyMarkdown(){
  var ordered=sessions.slice().sort(function(a,b){ return a.date.localeCompare(b.date)||((a.createdAt||0)-(b.createdAt||0)); });
  var out=[];
  out.push("# Registro de entrenamiento de fuerza");
  out.push("");
  out.push("Plan: Fuerza tres días — Día 1: Piernas y Glúteos · Día 2: Pecho, Bíceps y Tríceps · Día 3: Espalda y Bíceps.");
  out.push("Exportado: "+todayISO()+" · Sesiones registradas: "+sessions.length+".");
  out.push("Notación de series: `pesoKg×reps`; `×reps` = peso corporal (sin carga externa); `Ns` = isométrico en segundos. Volumen = suma de reps×peso.");
  out.push("");
  out.push("## Resumen");
  out.push("");
  out.push("| Fecha | Día | Series | Volumen (kg) |");
  out.push("|---|---|---|---|");
  ordered.forEach(function(s){ var day=findDay(s.dayId); var st=sessionStats(s);
    out.push("| "+s.date+" | "+(day?day.short+" · "+day.name:"—")+" | "+st.sets+" | "+st.volume+" |"); });
  out.push("");
  out.push("## Detalle por sesión");
  out.push("");
  ordered.forEach(function(s){ out.push(sessionMarkdown(s)); out.push(""); });
  return out.join("\n").trim()+"\n";
}
function doExportClaude(){
  if(!sessions.length){ alert("Aún no hay sesiones que exportar."); state.menuOpen=false; render(); return; }
  var blob=new Blob([historyMarkdown()],{type:"text/markdown"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download="fuerza-para-claude-"+todayISO()+".md"; a.click(); URL.revokeObjectURL(url);

function WeekRing(count){
  var arcs="";
  for(var i=0;i<3;i++){ var start=-90+i*120+6, end=-90+(i+1)*120-6; var filled=count>i;
    arcs+=arcPath(48,48,40,start,end,filled?"var(--accent)":"#ECECE6",9); }
  var svg='<div style="position:relative;width:96px;height:96px">'+
    '<svg width="96" height="96" viewBox="0 0 96 96">'+arcs+'</svg>'+
    '<div class="ringCenter"><div class="ringNum">'+count+'<span>/3</span></div><div class="ringCap">ESTA SEMANA</div></div></div>';
  var msg = count>=3?"¡Semana completada! 💪":(count===0?"Aún no has entrenado":("Te "+(3-count===1?"queda 1 sesión":("quedan "+(3-count)+" sesiones"))));
  var sub = count>=3?"Sigue así la semana que viene.":"Objetivo: 3 entrenamientos por semana.";
  return h("div",{class:"ringWrap"}, elHTML(svg),
    h("div",{style:"flex:1"},
      h("div",{style:"font-size:15px;font-weight:700"}, msg),
      h("div",{style:"font-size:13px;color:#8A8F98;margin-top:3px"}, sub)));
}
function arcPath(cx,cy,r,start,end,color,w){
  function p(a){ return [cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)]; }
  var a=p(start),b=p(end); var large=(end-start>180)?1:0;
  return '<path d="M '+a[0]+' '+a[1]+' A '+r+' '+r+' 0 '+large+' 1 '+b[0]+' '+b[1]+'" stroke="'+color+'" stroke-width="'+w+'" fill="none" stroke-linecap="round"/>';
}

function numInput(exId,i,field,ph,suffix){

function addSet(ex,rowsBox){

    : ex.type==="reps"?{reps:base.reps||"",done:false}
    : {reps:base.reps||"",weight:base.weight||"",done:false};
  arr.push(ns);
  rowsBox.appendChild(buildRow(ex,arr.length-1));
  // asegura botón quitar visible
  var card=rowsBox.parentNode;
  if(card&&card._remBtn&&arr.length>1&&!card._controls.contains(card._remBtn)) card._controls.appendChild(card._remBtn);

  if(card&&card._remBtn&&arr.length<=1&&card._controls.contains(card._remBtn)) card._controls.removeChild(card._remBtn);

function saveSession(){
  var entries={};

      if(s.done||s.reps||s.weight||s.seconds){ var o={};
        if(s.reps!==undefined&&s.reps!=="") o.reps=Number(s.reps);
        if(s.weight!==undefined&&s.weight!=="") o.weight=Number(s.weight);
        if(s.seconds!==undefined&&s.seconds!=="") o.seconds=Number(s.seconds);
        clean.push(o);

    });
    if(clean.length) entries[exId]=clean;
  }
  var session={id:uid(),date:state.entryDate,dayId:state.dayId,entries:entries,createdAt:Date.now()};
  sessions.push(session); sessions.sort(function(a,b){return a.date.localeCompare(b.date);});

    var stats=h("div",{style:"display:flex;gap:16px;margin-top:10px"},
      h("div",{}, h("div",{class:"statVal"}, totalSets), h("div",{class:"statLab"},"Series")));
    if(volume>0) stats.appendChild(h("div",{}, h("div",{class:"statVal"}, Math.round(volume).toLocaleString("es-ES")+" kg"), h("div",{class:"statLab"},"Volumen")));
    card.appendChild(stats);
    var det=h("details",{style:"margin-top:8px"});
    det.appendChild(h("summary",{class:"summary"},"Ver detalle"));
    var body=h("div",{style:"margin-top:8px;display:grid;gap:6px"});
    for(var exId in s.entries){ (function(exId){
      var ex=findEx(exId);
      var parts=s.entries[exId].map(function(set){
        return set.seconds!=null?(set.seconds+"s"):((set.reps!=null?set.reps:"–")+(set.weight!=null?"×"+set.weight+"kg":""));
      }).join("  ·  ");
      body.appendChild(h("div",{class:"detLine",html:"<b>"+esc(ex?ex.name:exId)+": </b>"+esc(parts)}));
    })(exId); }
    det.appendChild(body); card.appendChild(det);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}
function deleteSession(id){
  if(!confirm("¿Eliminar esta sesión? No se puede deshacer.")) return;
  sessions=sessions.filter(function(s){return s.id!==id;}); saveSessions(sessions); render();
}

/* ---- Preparar sesión para Strava (Nivel 1: manual asistido) ---- */
function stravaData(s){
  var day=findDay(s.dayId);
  var title=day?day.name:"Entrenamiento de fuerza";
  var base = s.createdAt ? new Date(s.createdAt) : new Date(s.date+"T19:30:00");
  var start = new Date(base.getTime() - 90*60000); // hora de subida − 1,5 h
  var startStr = pad(start.getHours())+":"+pad(start.getMinutes());
  var dateStr = new Date(s.date+"T00:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  dateStr = dateStr.charAt(0).toUpperCase()+dateStr.slice(1);
  var lines=[];
  if(day){ day.exercises.forEach(function(ex){
    var sets=s.entries[ex.id]; if(!sets||!sets.length) return;
    var parts=sets.map(function(set){
      if(set.seconds!=null) return set.seconds+"s";
      if(ex.type==="reps"||set.weight==null) return "×"+(set.reps!=null?set.reps:"–");
      return set.weight+"kg×"+(set.reps!=null?set.reps:"–");
    });
    lines.push(ex.name+": "+parts.join(", "));
  }); }
  return {title:title, type:"Entrenamiento con pesas", dateStr:dateStr, startStr:startStr, dur:"1 h", desc:lines.join("\n")};
}
function copyText(text, btn){
  var ok=function(){ var old=btn.textContent; btn.textContent="¡Copiado!"; setTimeout(function(){ btn.textContent=old; },1400); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text,ok); }); return; }
  }catch(e){}
  fallbackCopy(text,ok);
}
function fallbackCopy(text, ok){
  try{ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); ok&&ok(); }catch(e){}
}
function openStravaSheet(s){
  var d=stravaData(s);
  function row(k,v){ return h("div",{class:"sheetRow"}, h("span",{class:"k"},k), h("span",{class:"v"},v)); }
  var descBox=h("pre",{class:"sheetDesc"}, d.desc||"(sin series registradas)");
  var copyDesc=h("button",{class:"btnPri"},"Copiar descripción");
  copyDesc.addEventListener("click",function(){ copyText(d.desc, copyDesc); });
  var copyTitle=h("button",{class:"btnSec"},"Copiar título");
  copyTitle.addEventListener("click",function(){ copyText(d.title, copyTitle); });
  var openApp=h("a",{class:"btnStrava",href:"strava://",target:"_blank",rel:"noopener"},"Abrir Strava");
  var closeBtn=h("button",{class:"sheetClose"},"Cerrar");
  var sheet=h("div",{class:"sheet"},
    h("div",{class:"sheetH"},"Enviar a Strava"),
    row("Título", d.title),
    row("Tipo", d.type),
    row("Fecha", d.dateStr),
    row("Inicio", d.startStr),
    row("Duración", d.dur),
    h("div",{class:"sheetLab"},"Descripción"),
    descBox,
    h("div",{class:"sheetBtns"}, copyDesc, copyTitle),
    openApp,
    h("div",{class:"sheetHelp"},"En Strava: toca ➕ → Actividad manual, elige «Entrenamiento con pesas», pega la descripción y ajusta fecha, hora ("+d.startStr+") y duración (1 h)."),
    closeBtn
  );
  var ov=h("div",{class:"sheetOv"}, sheet);
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  closeBtn.addEventListener("click", close);
  ov.addEventListener("click", function(e){ if(e.target===ov) close(); });
  document.body.appendChild(ov);
}

/* ---- Estadísticas ---- */
function Stats(){
  if(!sessions.length) return Empty("Sin datos todavía","Cuando registres sesiones verás aquí tu cumplimiento semanal y la evolución de cada ejercicio.",null,null);
  var wrap=h("div",{});
  var weeksSet={}; sessions.forEach(function(s){ weeksSet[isoWeek(s.date)]=true; });
  var weeksTrained=Object.keys(weeksSet).length;
  var compliance=weeksTrained?Math.round((sessions.length/(weeksTrained*3))*100):0;

  var top=h("div",{style:"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px"},
    bigStat(sessions.length,"Sesiones"), bigStat(weeksTrained,"Semanas"), bigStat(compliance+"%","Cumplimiento"));
  wrap.appendChild(top);

  wrap.appendChild(h("div",{class:"sectionLabel"},"Sesiones por semana"));
  wrap.appendChild(h("div",{class:"chartCard"}, elHTML(weeklyChart()),
    h("div",{class:"chartHint"},"La línea marca el objetivo de 3/semana")));

  wrap.appendChild(h("div",{class:"sectionLabel",style:"margin-top:22px"},"Evolución por ejercicio"));
  var sel=h("select",{class:"exSel"});
  PLAN.forEach(function(d){
    var og=document.createElement("optgroup"); og.label=d.short+" · "+d.name;
    d.exercises.forEach(function(e){ var o=document.createElement("option"); o.value=e.id; o.textContent=e.name;
      if(e.id===state.statEx) o.selected=true; og.appendChild(o); });
    sel.appendChild(og);
  });
  sel.addEventListener("change",function(e){ state.statEx=e.target.value; render(); });
  wrap.appendChild(sel);
  wrap.appendChild(h("div",{class:"chartCard",style:"margin-top:10px"}, elHTML(exerciseChart())));
  return wrap;
}
function bigStat(v,l){ return h("div",{class:"bigStat"}, h("div",{class:"v"}, v), h("div",{class:"l"}, l)); }

function weeklyChart(){
  var map={}; sessions.forEach(function(s){ var k=isoWeek(s.date); map[k]=(map[k]||0)+1; });
  var weeks=[]; var now=new Date();
  for(var i=7;i>=0;i--){ var d=new Date(now); d.setDate(now.getDate()-i*7);
    var iso=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    weeks.push({label:weekLabel(iso), v:map[isoWeek(iso)]||0}); }
  var W=436,H=170,padL=24,padB=22,padT=8; var maxV=Math.max(3, Math.max.apply(null,weeks.map(function(w){return w.v;})));
  var plotH=H-padB-padT, plotW=W-padL-8, n=weeks.length, bw=plotW/n*0.6;
  var svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  [0,1,2,3].forEach(function(t){ var y=padT+plotH-(t/maxV)*plotH;
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#EEEEE8" stroke-dasharray="2 4"/>';
    svg+='<text x="'+(padL-6)+'" y="'+(y+3)+'" font-size="10" fill="#9AA0A6" text-anchor="end">'+t+'</text>'; });
  var y3=padT+plotH-(3/maxV)*plotH;
  svg+='<line x1="'+padL+'" y1="'+y3+'" x2="'+(W-8)+'" y2="'+y3+'" stroke="var(--accent)" stroke-dasharray="4 4"/>';
  weeks.forEach(function(w,i){ var cx=padL+(i+0.5)*(plotW/n); var barH=(w.v/maxV)*plotH; var y=padT+plotH-barH;
    svg+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(barH,0)+'" rx="4" fill="var(--accent)"/>';
    svg+='<text x="'+cx+'" y="'+(H-6)+'" font-size="9.5" fill="#9AA0A6" text-anchor="middle">'+w.label+'</text>'; });
  svg+='</svg>'; return svg;
}
function exerciseChart(){
  var exId=state.statEx, ex=findEx(exId);
  var pts=[]; sessions.filter(function(s){return s.entries[exId];})
    .sort(function(a,b){return a.date.localeCompare(b.date);})
    .forEach(function(s){ var arr=s.entries[exId];
      var val = ex.type==="time"?Math.max.apply(null,arr.map(function(x){return x.seconds||0;}))
        : ex.type==="reps"?Math.max.apply(null,arr.map(function(x){return x.reps||0;}))
        : Math.max.apply(null,arr.map(function(x){return x.weight||0;}));
      pts.push({date:fmtDate(s.date), v:val}); });
  var label = ex.type==="time"?"Segundos":ex.type==="reps"?"Reps máximas":"Peso máximo (kg)";
  if(pts.length<1) return '<div style="height:170px;display:flex;align-items:center;justify-content:center;color:#B4B8BD;font-size:13px">Sin registros de este ejercicio todavía.</div>';
  var W=436,H=190,padL=34,padB=24,padT=20,padR=10;
  var vals=pts.map(function(p){return p.v;}); var maxV=Math.max.apply(null,vals), minV=Math.min.apply(null,vals);
  if(maxV===minV){ maxV=maxV+ (maxV||1); minV=Math.max(0,minV-(minV?minV*0.2:1)); }
  var plotH=H-padB-padT, plotW=W-padL-padR;
  function X(i){ return pts.length===1?padL+plotW/2:padL+(i/(pts.length-1))*plotW; }
  function Y(v){ return padT+plotH-((v-minV)/(maxV-minV))*plotH; }
  var svg='<div style="font-size:12px;color:#9AA0A6;font-weight:600;margin-bottom:2px">'+label+'</div>';
  svg+='<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(var g=0;g<=2;g++){ var vv=minV+(maxV-minV)*g/2; var y=Y(vv);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#EEEEE8" stroke-dasharray="2 4"/>';
    svg+='<text x="'+(padL-6)+'" y="'+(y+3)+'" font-size="10" fill="#9AA0A6" text-anchor="end">'+Math.round(vv)+'</text>'; }
  var dpath=""; pts.forEach(function(p,i){ dpath+=(i?" L ":"M ")+X(i)+" "+Y(p.v); });
  svg+='<path d="'+dpath+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){ svg+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="3.2" fill="var(--accent)"/>'; });
  var step=Math.ceil(pts.length/6);
  pts.forEach(function(p,i){ if(i%step===0||i===pts.length-1){
    svg+='<text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" fill="#9AA0A6" text-anchor="middle">'+p.date+'</text>'; } });
  svg+='</svg>'; return svg;
}

  var el=h("div",{class:"empty"},
    h("div",{class:"emptyIco"}, elHTML('<span style="color:#C4C8CC">'+ico("dumbbell",26)+'</span>')),
    h("div",{class:"emptyTitle"}, title),
    h("div",{class:"emptyBody"}, body));
  if(cta) el.appendChild(h("button",{class:"saveBtn",style:"margin-top:10px",onclick:onCta}, cta));
  return el;
}

/* ---- Nav ---- */
function Nav(){
  var items=[["train","Entrenar","dumbbell"],["history","Historial","cal"],["stats","Progreso","trend"]];
  var nav=h("div",{class:"nav"});
  items.forEach(function(it){
    var active=state.view===it[0];
    var b=h("button",{class:"navBtn"+(active?" active":""),onclick:function(){ state.view=it[0]; if(it[0]!=="train") state.dayId=null; loggerCounterEl=null; render(); }},
      elHTML(ico(it[2],22,active?2.5:2)), h("span",{}, it[1]));
    nav.appendChild(b);
  });
  return nav;
}
